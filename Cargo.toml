[workspace]
resolver = "2"
members = [
    "cbc-core",
    "cbc-transform",
    "cbc-cli",
]
exclude = [
    "cbc-core/fuzz",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.70"
license = "MIT"
repository = "https://github.com/cobalt-format/cobalt"
keywords = ["container", "integrity", "merkle", "tamper-evident", "binary-format"]
categories = ["encoding", "cryptography"]
