[package]
name = "cbc-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Core library for CBC (Context-Bound Container) v0.1 — binary container format with intrinsic integrity"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)'] }

[dependencies]
blake3 = { version = "1", default-features = false }
sha2 = { version = "0.10", default-features = false }
crc32c = "0.6"
thiserror = { version = "2", optional = true }
rand = { version = "0.8", default-features = false, optional = true }
aes-gcm = { version = "0.10.3", default-features = false, features = ["aes"] }
aead = { version = "0.5.2", default-features = false }
zstd = { version = "0.13.3", optional = true }
hex = { version = "0.4", default-features = false, features = ["alloc"] }
subtle = { version = "2.6", default-features = false }
aws-lc-rs = { version = "1.10.0", optional = true }

[features]
default = ["std"]
std = ["blake3/std", "sha2/std", "thiserror", "rand/std", "rand/std_rng", "zstd", "aead/std", "aes-gcm/std"]
alloc = ["aead/alloc", "aes-gcm/alloc"]
fips = ["aws-lc-rs/fips"]

[dev-dependencies]
criterion = "0.5"
proptest = "1.5"
tempfile = "3.10"
serde_json = "1.0"
serde = { version = "1.0.228", features = ["derive"] }
base64 = "0.22.1"

[[bench]]
name = "throughput"
harness = false

[[bench]]
name = "saturation"
harness = false
