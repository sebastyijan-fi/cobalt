name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Release (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: cbc-linux-amd64
            binary_name: cbc
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: cbc-macos-arm64
            binary_name: cbc
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: cbc-windows-amd64.exe
            binary_name: cbc.exe

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build Binary
        run: cargo build --release --target ${{ matrix.target }} -p cbc-cli

      - name: Prepare Artifact
        shell: bash
        run: |
          mkdir -p release
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            cp target/${{ matrix.target }}/release/cbc.exe release/${{ matrix.binary_name }}
          else
            cp target/${{ matrix.target }}/release/cbc release/${{ matrix.binary_name }}
          fi

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: release/${{ matrix.binary_name }}
          generate_release_notes: true
