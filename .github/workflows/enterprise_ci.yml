name: Enterprise CI & SEC Gates

on:
  push:
    branches: [ "main", "release/*" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  static-analysis-and-audit:
    name: Static Analysis & Cargo Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Rustfmt
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      
      # Cargo Audit for CVEs
      - name: Install cargo-audit
        run: cargo install cargo-audit
      - name: Cargo Audit
        run: cargo audit

      # Cargo Deny for supply chain license/bantree scanning
      - name: Install cargo-deny
        run: cargo install --locked cargo-deny
      - name: Cargo Deny Check
        run: cargo deny check

  test-rust:
    name: Test Workspace (Rust)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Generate Core Vectors
        run: cargo test -p cbc-core --test generate_vectors -- --nocapture
      - name: Run Tests
        run: cargo test --workspace

  test-node:
    name: Conformance Suite (Node/TS)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Rust (for Neon native build)
        uses: dtolnay/rust-toolchain@stable
      - name: Build and Test Node Bindings
        working-directory: ./cbc-node
        run: |
          npm ci
          npm run build || cargo build --release # fallback if missing
          npx jest

  test-python:
    name: Conformance Suite (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Rust (for Maturin build)
        uses: dtolnay/rust-toolchain@stable
      - name: Build and Test PyO3 Bindings
        working-directory: ./cbc-py
        run: |
          python -m pip install --upgrade pip maturin pytest
          maturin develop
          pytest tests/test_conformance.py
